name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller mss Pillow pyautogui websockets pywin32 cryptography

      - name: Generate TLS cert
        run: |
          cd agent
          python tls_gen.py

      - name: Build windows32.exe
        run: |
          cd agent
          pyinstaller --noconfirm --onefile --noconsole --uac-admin `
            --name windows32 `
            --hidden-import mss `
            --hidden-import PIL `
            --hidden-import pyautogui `
            --hidden-import websockets `
            --hidden-import websockets.legacy `
            --hidden-import websockets.legacy.server `
            --hidden-import websockets.legacy.client `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --hidden-import win32event `
            --hidden-import servicemanager `
            --hidden-import pywintypes `
            --hidden-import cryptography `
            --hidden-import winreg `
            --add-data "cert.pem;." `
            --add-data "key.pem;." `
            main.py

      - name: Upload agent
        uses: actions/upload-artifact@v4
        with:
          name: windows32
          path: agent/dist/windows32.exe

  build-controller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 websockets

      - name: Build test.exe
        run: |
          cd controller
          pyinstaller --noconfirm --onefile --noconsole `
            --name test `
            --hidden-import PyQt6 `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import websockets `
            --hidden-import websockets.legacy `
            --hidden-import websockets.legacy.client `
            --hidden-import ssl `
            main.py

      - name: Upload controller
        uses: actions/upload-artifact@v4
        with:
          name: test
          path: controller/dist/test.exe
