name: Build windows32.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-agent:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          pip install pyinstaller mss Pillow pyautogui websockets pywin32 cryptography

      - name: Генерация TLS сертификата
        run: |
          cd agent
          python tls_gen.py

      - name: Сборка windows32.exe
        run: |
          cd agent
          pyinstaller --noconfirm --onefile --noconsole --uac-admin `
            --name windows32 `
            --hidden-import mss `
            --hidden-import PIL `
            --hidden-import pyautogui `
            --hidden-import websockets `
            --hidden-import websockets.legacy `
            --hidden-import websockets.legacy.server `
            --hidden-import websockets.legacy.client `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --hidden-import win32event `
            --hidden-import servicemanager `
            --hidden-import pywintypes `
            --hidden-import cryptography `
            --hidden-import winreg `
            --add-data "cert.pem;." `
            --add-data "key.pem;." `
            main.py

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: windows32
          path: agent/dist/windows32.exe
